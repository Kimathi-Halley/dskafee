<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dawne's Soleil Kafé | Coming Soon</title>
    <meta name="description" content="Dawne's Soleil Kafé — authentic Caribbean cuisine in Antigua. Our new site is coming soon." />
    <link rel="canonical" href="https://dsoleilkafe.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="Dawne's Soleil Kafé | Coming Soon" />
    <meta property="og:description" content="Authentic Caribbean flavours made with love. Our new site is coming soon." />
    <meta property="og:image" content="https://dsoleilkafe.com/images/food/soleil_grilled_lobster.webp" />
    <meta property="og:url" content="https://dsoleilkafe.com/" />
    <meta property="og:site_name" content="Dawne's Soleil Kafé" />

    <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />

    <link rel="stylesheet" href="/css/fonts.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #F5F0E0;
        --fg: #1A1A1A;
        --accent1: #2BA89A;
        --accent2: #E2B430;
        --accent4: #1B4D3E;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg,
          #2BA89A 0%,
          #3CC4A8 30%,
          #6BD4A0 60%,
          #E0DCBA 85%,
          #F5F0E0 100%
        );
        color: var(--fg);
        font-family: "montserrat", sans-serif;
        text-align: center;
        padding: 2rem;
        overflow: hidden;
      }

      .coming-soon {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        max-width: 600px;
        animation: fadeIn 1.2s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .logo {
        width: 120px;
        margin-bottom: 0.5rem;
      }

      .logo img {
        width: 100%;
        height: auto;
      }

      .title {
        font-family: "nurture-your-best";
        text-transform: uppercase;
        line-height: 0.95;
      }

      .title-line1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        display: block;
      }

      .title-line2 {
        font-size: clamp(3rem, 10vw, 6.5rem);
        display: block;
      }

      .subtitle {
        font-family: "nurture-your-best";
        font-style: italic;
        font-size: clamp(1rem, 3vw, 1.4rem);
        letter-spacing: 2px;
        opacity: 0.85;
      }

      .divider {
        width: 60px;
        height: 2px;
        background: var(--fg);
        opacity: 0.3;
      }

      .coming-text {
        font-family: "montserrat", sans-serif;
        font-weight: 300;
        font-size: clamp(0.9rem, 2.5vw, 1.15rem);
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: 0.7;
      }

      .contact-info {
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .contact-info a {
        color: var(--fg);
        text-decoration: none;
        font-weight: 400;
        font-size: 0.95rem;
        transition: opacity 0.2s;
      }

      .contact-info a:hover {
        opacity: 0.6;
      }

      .contact-info span {
        font-size: 0.85rem;
        opacity: 0.6;
        font-weight: 300;
      }
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Dawne's Soleil Kafé",
      "url": "https://dsoleilkafe.com",
      "telephone": "+1-268-562-9801",
      "email": "dsoleilkafe@gmail.com",
      "servesCuisine": ["Caribbean", "Antiguan", "Creole"],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Hodges Bay Main Road",
        "addressLocality": "Hodges Bay",
        "addressRegion": "Saint John",
        "addressCountry": "AG"
      }
    }
    </script>
  </head>
  <body>
    <div class="coming-soon">
      <div class="logo">
        <img src="/images/logo/dawnes-logo.svg" alt="Dawne's Soleil Kafé" />
      </div>

      <div class="title">
        <span class="title-line1">Dawne's</span>
        <span class="title-line2">Soleil Kafe</span>
      </div>

      <p class="subtitle">~ Caribbean Cuisine ~</p>

      <div class="divider"></div>

      <p class="coming-text">Website Coming Soon</p>

      <div class="contact-info">
        <span>Hodges Bay, Antigua</span>
        <a href="tel:+12685629801">268-562-9801</a>
        <a href="tel:+12687641122">268-764-1122</a>
        <a href="mailto:dsoleilkafe@gmail.com">dsoleilkafe@gmail.com</a>
      </div>
    </div>
  </body>
</html>
